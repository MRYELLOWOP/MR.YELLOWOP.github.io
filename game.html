<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR.YELLOW GAME</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="game.css">


</head>


<body>


<header>

    <div class="logo">
        MR.YELLOW 🟡
    </div>


    <a class="back-game" href="index.html">
        🏠 خانه
    </a>

</header>





<main class="game-page">


<h1>
    🔨 فتاح و دماغش
</h1>


<p class="game-sub">
    فتاح رو بزن، دماغش رو نزن! 😂
</p>






<div class="player-name-box">


<label>
    نام بازیکن
</label>


<input
    id="playerName"
    type="text"
    maxlength="15"
    placeholder="مثلاً Ariyan"
>


</div>








<div class="game-info">


<div>

    امتیاز

    <strong id="score">
        0
    </strong>

</div>



<div>

    زمان

    <strong id="gameTime">
        03:00
    </strong>

</div>



<div>

    جان

    <strong id="lives">
        ❤️❤️❤️
    </strong>

</div>


</div>









<div class="game-board">


<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>



<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>



<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>



<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>

<button class="hole"></button>


</div>









<button id="startBtn" class="start-btn">

🎮 شروع بازی

</button>





<p id="gameMessage">

اسم را وارد کن و شروع کن

</p>









<div class="game-buttons">


<button id="guideBtn">

📖 راهنما

</button>




<button id="scoresBtn">

🏆 جدول امتیازات

</button>


</div>









<!-- GUIDE -->


<div class="game-modal" id="guideModal">


<div class="modal-box">


<button id="closeGuide">

✖

</button>


<h2>
📖 راهنما
</h2>


<p>

👨 فتاح = +۱ امتیاز

<br>

💣 دماغ = کم شدن جان

<br>

❤️ سه جان داری

<br>

⏱️ سه دقیقه زمان داری


</p>


</div>

</div>









<!-- SCORES -->


<div class="game-modal" id="scoresModal">


<div class="modal-box">


<button id="closeScores">

✖

</button>


<h2>
🏆 جدول امتیازات
</h2>


<div id="scoreList">

در حال دریافت...

</div>


</div>

</div>








<footer>


© MR.YELLOW


<br>


ساخته شده توسط


<strong>
Ariyan
</strong>


</footer>









<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="game.js"></script>



</body>

</html>
